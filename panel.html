<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Agenda | Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f5f8;
      color: #29252e;
      padding: 24px 15px;
    }

    .contenedor {
      max-width: 620px;
      margin: auto;
    }

    .encabezado {
      text-align: center;
      margin-bottom: 24px;
    }

    .encabezado h1 {
      margin: 0 0 6px;
      font-size: 29px;
    }

    .encabezado p {
      margin: 0;
      color: #777;
    }

    .tarjeta {
      background: white;
      padding: 23px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.07);
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 13px;
      border: 1px solid #ddd6df;
      border-radius: 14px;
      font-size: 16px;
      background: #faf8fb;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #514458;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .oculto {
      display: none;
    }

    .mensaje {
      margin-top: 15px;
      padding: 14px;
      border-radius: 13px;
    }

    .error {
      background: #fdeeee;
    }

    .barra {
      margin-bottom: 20px;
      padding-bottom: 17px;
      border-bottom: 1px solid #eee9f0;
    }

    .correo {
      font-size: 14px;
      color: #777;
      margin-bottom: 12px;
    }

    .cerrar {
      background: #eee9f0;
      color: #514458;
    }

    .titulo-citas {
      margin: 25px 0 14px;
    }

    .citas {
      display: grid;
      gap: 13px;
    }

    .cita {
      background: #faf8fb;
      border: 1px solid #ebe5ed;
      border-radius: 17px;
      padding: 17px;
    }

    .fecha {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .hora {
      color: #514458;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .dato {
      margin: 5px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .estado {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eee9f0;
      font-size: 13px;
      font-weight: bold;
    }

    .cargando,
    .sin-citas {
      text-align: center;
      padding: 25px 10px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>AR Agenda</h1>
    <p>Panel de administración</p>
  </div>

  <div class="tarjeta">

    <div id="login">

      <h2>Iniciar sesión</h2>

      <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
      >

      <button id="btnLogin">
        Entrar
      </button>

    </div>


    <div id="panel" class="oculto">

      <div class="barra">

        <h2>Mis citas 💜</h2>

        <div class="correo">
          Sesión:
          <span id="correoUsuario"></span>
        </div>

        <button
          id="btnCerrar"
          class="cerrar"
        >
          Cerrar sesión
        </button>

      </div>

      <h2 class="titulo-citas">
        Próximas citas
      </h2>

      <div id="listaCitas" class="citas">

        <div class="cargando">
          Cargando citas...
        </div>

      </div>

    </div>


    <div
      id="mensaje"
      class="mensaje oculto"
    ></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://wbdijpsiovssuhxzzovi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_T-fiB_MwofciQDOd7KWVOQ_LBVpq9xB";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const login =
  document.getElementById("login");

const panel =
  document.getElementById("panel");

const mensaje =
  document.getElementById("mensaje");

const listaCitas =
  document.getElementById("listaCitas");


document
  .getElementById("btnLogin")
  .addEventListener(
    "click",
    iniciarSesion
  );


document
  .getElementById("btnCerrar")
  .addEventListener(
    "click",
    cerrarSesion
  );


async function iniciarSesion() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  ocultarMensaje();

  if (!email || !password) {

    mostrarError(
      "Escribe tu correo y contraseña."
    );

    return;
  }


  const {
    data,
    error
  } = await db.auth.signInWithPassword({
    email,
    password
  });


  if (error) {

    mostrarError(
      "Correo o contraseña incorrectos."
    );

    return;
  }


  await mostrarPanel(
    data.user
  );
}


async function cerrarSesion() {

  await db.auth.signOut();

  panel.classList.add("oculto");

  login.classList.remove("oculto");

  document
    .getElementById("password")
    .value = "";

  ocultarMensaje();
}


async function mostrarPanel(usuario) {

  login.classList.add("oculto");

  panel.classList.remove("oculto");

  document
    .getElementById("correoUsuario")
    .textContent =
      usuario.email;

  await cargarCitas();
}


async function cargarCitas() {

  listaCitas.innerHTML =
    '<div class="cargando">Cargando citas...</div>';


  const hoy = new Date();

  const hoyTexto =
    hoy.getFullYear()
    + "-"
    + String(
        hoy.getMonth() + 1
      ).padStart(2, "0")
    + "-"
    + String(
        hoy.getDate()
      ).padStart(2, "0");


  const {
    data: citas,
    error
  } = await db
    .from("citas")
    .select(`
      id,
      profesional_id,
      paciente_nombre,
      paciente_telefono,
      paciente_email,
      fecha,
      hora_inicio,
      hora_fin,
      estado,
      servicios (
        nombre
      )
    `)
    .gte("fecha", hoyTexto)
    .order("fecha", {
      ascending: true
    })
    .order("hora_inicio", {
      ascending: true
    });


  if (error) {

    console.error(error);

    listaCitas.innerHTML =
      '<div class="sin-citas">No fue posible cargar las citas.</div>';

    return;
  }


  if (!citas || citas.length === 0) {

    listaCitas.innerHTML =
      '<div class="sin-citas">No tienes próximas citas.</div>';

    return;
  }


  /*
    Sacamos todos los IDs de profesionales
    que aparecen en las citas.
  */

  const idsProfesionales =
    [
      ...new Set(
        citas
          .map(cita => cita.profesional_id)
          .filter(Boolean)
      )
    ];


  let mapaProfesionales = {};


  if (idsProfesionales.length > 0) {

    const {
      data: profesionales,
      error: errorProfesionales
    } = await db
      .from("profesionales_publicos")
      .select("id, nombre")
      .in("id", idsProfesionales);


    if (errorProfesionales) {

      console.error(
        errorProfesionales
      );

    } else {

      profesionales.forEach(
        profesional => {

          mapaProfesionales[
            profesional.id
          ] = profesional.nombre;

        }
      );

    }

  }


  listaCitas.innerHTML = "";


  citas.forEach(cita => {

    const tarjeta =
      document.createElement("div");

    tarjeta.className =
      "cita";


    const fechaBonita =
      formatearFecha(
        cita.fecha
      );


    const horaInicio =
      String(
        cita.hora_inicio
      ).substring(0, 5);


    const horaFin =
      String(
        cita.hora_fin
      ).substring(0, 5);


    const servicio =
      cita.servicios
      ? cita.servicios.nombre
      : "Sin servicio";


    const profesional =
      mapaProfesionales[
        cita.profesional_id
      ] || "Sin profesional";


    tarjeta.innerHTML = `

      <div class="fecha">
        📅 ${fechaBonita}
      </div>

      <div class="hora">
        🕐 ${horaInicio} - ${horaFin}
      </div>

      <div class="dato">
        <strong>Paciente:</strong>
        ${cita.paciente_nombre || ""}
      </div>

      <div class="dato">
        <strong>Teléfono:</strong>
        ${cita.paciente_telefono || ""}
      </div>

      ${
        cita.paciente_email
        ?
        `
        <div class="dato">
          <strong>Correo:</strong>
          ${cita.paciente_email}
        </div>
        `
        :
        ""
      }

      <div class="dato">
        <strong>Servicio:</strong>
        ${servicio}
      </div>

      <div class="dato">
        <strong>Profesional:</strong>
        ${profesional}
      </div>

      <div class="estado">
        ${cita.estado}
      </div>

    `;


    listaCitas.appendChild(
      tarjeta
    );

  });

}


function formatearFecha(fecha) {

  const partes =
    fecha.split("-");

  return (
    partes[2]
    + "/"
    + partes[1]
    + "/"
    + partes[0]
  );
}


async function revisarSesion() {

  const {
    data
  } = await db.auth.getSession();


  if (
    data.session &&
    data.session.user
  ) {

    await mostrarPanel(
      data.session.user
    );
  }
}


function mostrarError(texto) {

  mensaje.textContent =
    texto;

  mensaje.className =
    "mensaje error";
}


function ocultarMensaje() {

  mensaje.className =
    "mensaje oculto";
}


revisarSesion();

</script>

</body>
</html>
