<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Agenda | Panel</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>AR Agenda</h1>
    <p>Panel de administración</p>
  </div>

  <div class="tarjeta">

    <div id="login">

      <h2>Iniciar sesión</h2>

      <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
      >

      <button id="btnLogin">
        Entrar
      </button>

    </div>


    <div id="panel" class="oculto">

      <div class="barra">

        <div class="negocio">
          <div class="negocio-label">
            Negocio
          </div>

          <div
            id="nombreNegocio"
            class="negocio-nombre"
          >
            Cargando...
          </div>
        </div>

        <h2>Mis citas 💜</h2>

        <div class="correo">
          Sesión:
          <span id="correoUsuario"></span>
        </div>

        <button
          id="btnCerrar"
          class="cerrar"
        >
          Cerrar sesión
        </button>

      </div>

      <h2 class="titulo-citas">
        Próximas citas
      </h2>

      <div id="listaCitas" class="citas">

        <div class="cargando">
          Cargando citas...
        </div>

      </div>

    </div>


    <div
      id="mensaje"
      class="mensaje oculto"
    ></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://wbdijpsiovssuhxzzovi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_T-fiB_MwofciQDOd7KWVOQ_LBVpq9xB";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let negocioActualId = null;
let negocioActualNombre = null;


const login =
  document.getElementById("login");

const panel =
  document.getElementById("panel");

const mensaje =
  document.getElementById("mensaje");

const listaCitas =
  document.getElementById("listaCitas");

const nombreNegocio =
  document.getElementById("nombreNegocio");


document
  .getElementById("btnLogin")
  .addEventListener(
    "click",
    iniciarSesion
  );


document
  .getElementById("btnCerrar")
  .addEventListener(
    "click",
    cerrarSesion
  );


async function iniciarSesion() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  ocultarMensaje();

  if (!email || !password) {

    mostrarError(
      "Escribe tu correo y contraseña."
    );

    return;
  }


  const {
    data,
    error
  } = await db.auth.signInWithPassword({
    email,
    password
  });


  if (error) {

    mostrarError(
      "Correo o contraseña incorrectos."
    );

    return;
  }


  await mostrarPanel(
    data.user
  );
}


async function cerrarSesion() {

  await db.auth.signOut();

  negocioActualId = null;
  negocioActualNombre = null;

  panel.classList.add("oculto");

  login.classList.remove("oculto");

  document
    .getElementById("password")
    .value = "";

  ocultarMensaje();
}


async function mostrarPanel(usuario) {

  login.classList.add("oculto");

  panel.classList.remove("oculto");

  document
    .getElementById("correoUsuario")
    .textContent =
      usuario.email;

  nombreNegocio.textContent =
    "Cargando...";


  const negocioEncontrado =
    await cargarNegocioUsuario(
      usuario.id
    );


  if (!negocioEncontrado) {

    listaCitas.innerHTML =
      '<div class="sin-citas">No se encontró un negocio asociado a esta cuenta.</div>';

    return;
  }


  await cargarCitas();
}


async function cargarNegocioUsuario(
  usuarioId
) {

  const {
    data: membresias,
    error
  } = await db
    .from("miembros_negocio")
    .select(`
      negocio_id,
      es_admin,
      es_profesional,
      activo
    `)
    .eq(
      "usuario_id",
      usuarioId
    )
    .eq(
      "activo",
      true
    )
    .limit(1);


  if (error) {

    console.error(error);

    nombreNegocio.textContent =
      "No disponible";

    mostrarError(
      "No fue posible identificar el negocio de esta cuenta."
    );

    return false;
  }


  if (
    !membresias ||
    membresias.length === 0
  ) {

    nombreNegocio.textContent =
      "Sin negocio";

    return false;
  }


  negocioActualId =
    membresias[0].negocio_id;


  const {
    data: negocios,
    error: errorNegocio
  } = await db
    .from("negocios_publicos")
    .select("id, nombre")
    .eq(
      "id",
      negocioActualId
    )
    .limit(1);


  if (
    errorNegocio ||
    !negocios ||
    negocios.length === 0
  ) {

    console.error(errorNegocio);

    nombreNegocio.textContent =
      "Negocio";

    negocioActualNombre =
      "Negocio";

    return true;
  }


  negocioActualNombre =
    negocios[0].nombre;


  nombreNegocio.textContent =
    negocioActualNombre;


  return true;
}


async function cargarCitas() {

  listaCitas.innerHTML =
    '<div class="cargando">Cargando citas...</div>';


  const hoy =
    new Date();


  const hoyTexto =
    hoy.getFullYear()
    + "-"
    + String(
        hoy.getMonth() + 1
      ).padStart(2, "0")
    + "-"
    + String(
        hoy.getDate()
      ).padStart(2, "0");


  const {
    data: citas,
    error
  } = await db
    .from("citas")
    .select(`
      id,
      negocio_id,
      profesional_id,
      paciente_nombre,
      paciente_telefono,
      paciente_email,
      fecha,
      hora_inicio,
      hora_fin,
      estado,
      servicios (
        nombre
      )
    `)
    .eq(
      "negocio_id",
      negocioActualId
    )
    .gte(
      "fecha",
      hoyTexto
    )
    .order(
      "fecha",
      {
        ascending: true
      }
    )
    .order(
      "hora_inicio",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    listaCitas.innerHTML =
      '<div class="sin-citas">No fue posible cargar las citas.</div>';

    return;
  }


  if (
    !citas ||
    citas.length === 0
  ) {

    listaCitas.innerHTML =
      '<div class="sin-citas">No tienes próximas citas.</div>';

    return;
  }


  const idsProfesionales =
    [
      ...new Set(
        citas
          .map(
            cita =>
              cita.profesional_id
          )
          .filter(Boolean)
      )
    ];


  let mapaProfesionales = {};


  if (
    idsProfesionales.length > 0
  ) {

    const {
      data: profesionales,
      error: errorProfesionales
    } = await db
      .from(
        "profesionales_publicos"
      )
      .select(
        "id, nombre"
      )
      .in(
        "id",
        idsProfesionales
      );


    if (
      !errorProfesionales &&
      profesionales
    ) {

      profesionales.forEach(
        profesional => {

          mapaProfesionales[
            profesional.id
          ] =
            profesional.nombre;

        }
      );

    }

  }


  listaCitas.innerHTML = "";


  citas.forEach(cita => {

    const tarjeta =
      document.createElement(
        "div"
      );

    tarjeta.className =
      "cita";


    const fechaBonita =
      formatearFecha(
        cita.fecha
      );


    const horaInicio =
      String(
        cita.hora_inicio
      ).substring(
        0,
        5
      );


    const horaFin =
      String(
        cita.hora_fin
      ).substring(
        0,
        5
      );


    const servicio =
      cita.servicios
      ? cita.servicios.nombre
      : "Sin servicio";


    const profesional =
      mapaProfesionales[
        cita.profesional_id
      ] ||
      "Sin profesional";


    const estadoTexto =
      nombreEstado(
        cita.estado
      );


    tarjeta.innerHTML = `

      <div class="fecha">
        📅 ${fechaBonita}
      </div>

      <div class="hora">
        🕐 ${horaInicio} - ${horaFin}
      </div>

      <div class="dato">
        <strong>Paciente:</strong>
        ${escapar(
          cita.paciente_nombre || ""
        )}
      </div>

      <div class="dato">
        <strong>Teléfono:</strong>
        ${escapar(
          cita.paciente_telefono || ""
        )}
      </div>

      ${
        cita.paciente_email
        ?
        `
        <div class="dato">
          <strong>Correo:</strong>
          ${escapar(
            cita.paciente_email
          )}
        </div>
        `
        :
        ""
      }

      <div class="dato">
        <strong>Servicio:</strong>
        ${escapar(servicio)}
      </div>

      <div class="dato">
        <strong>Profesional:</strong>
        ${escapar(profesional)}
      </div>

      <div
        class="estado estado-${cita.estado}"
      >
        ${estadoTexto}
      </div>

      <div class="acciones">

        <button
          class="btn-confirmar"
          onclick="cambiarEstado(
            '${cita.id}',
            'confirmada'
          )"
          ${
            cita.estado ===
            "confirmada"
            ? "disabled"
            : ""
          }
        >
          ✓ Confirmar
        </button>

        <button
          class="btn-atendida"
          onclick="cambiarEstado(
            '${cita.id}',
            'atendida'
          )"
          ${
            cita.estado ===
            "atendida"
            ? "disabled"
            : ""
          }
        >
          ✓ Atendida
        </button>

        <button
          class="btn-cancelar"
          onclick="cambiarEstado(
            '${cita.id}',
            'cancelada'
          )"
          ${
            cita.estado ===
            "cancelada"
            ? "disabled"
            : ""
          }
        >
          ✕ Cancelar
        </button>

        <button
          class="btn-no-asistio"
          onclick="cambiarEstado(
            '${cita.id}',
            'no_asistio'
          )"
          ${
            cita.estado ===
            "no_asistio"
            ? "disabled"
            : ""
          }
        >
          No asistió
        </button>

      </div>

    `;


    listaCitas.appendChild(
      tarjeta
    );

  });

}


async function cambiarEstado(
  citaId,
  nuevoEstado
) {

  ocultarMensaje();


  if (
    nuevoEstado ===
    "cancelada"
  ) {

    const confirmar =
      window.confirm(
        "¿Seguro que deseas cancelar esta cita?"
      );

    if (!confirmar) {
      return;
    }

  }


  const {
    error
  } = await db
    .from("citas")
    .update({
      estado:
        nuevoEstado
    })
    .eq(
      "id",
      citaId
    )
    .eq(
      "negocio_id",
      negocioActualId
    );


  if (error) {

    console.error(error);

    mostrarError(
      "No fue posible cambiar el estado de la cita."
    );

    return;
  }


  mostrarExito(
    "Estado actualizado correctamente."
  );


  await cargarCitas();
}


function nombreEstado(
  estado
) {

  const nombres = {

    pendiente:
      "Pendiente",

    confirmada:
      "Confirmada",

    atendida:
      "Atendida",

    cancelada:
      "Cancelada",

    no_asistio:
      "No asistió"
  };


  return nombres[estado]
    || estado;
}


function formatearFecha(
  fecha
) {

  const partes =
    fecha.split("-");

  return (
    partes[2]
    + "/"
    + partes[1]
    + "/"
    + partes[0]
  );
}


function escapar(
  texto
) {

  return String(texto)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


async function revisarSesion() {

  const {
    data
  } =
    await db.auth.getSession();


  if (
    data.session &&
    data.session.user
  ) {

    await mostrarPanel(
      data.session.user
    );

  }

}


function mostrarError(
  texto
) {

  mensaje.textContent =
    texto;

  mensaje.className =
    "mensaje error";
}


function mostrarExito(
  texto
) {

  mensaje.textContent =
    texto;

  mensaje.className =
    "mensaje exito";
}


function ocultarMensaje() {

  mensaje.className =
    "mensaje oculto";
}


revisarSesion();

</script>

  <script src="panel.js"></script>

</body>
</html>
