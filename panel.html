<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Agenda | Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f5f8;
      color: #29252e;
      padding: 24px 15px;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    .encabezado {
      text-align: center;
      margin-bottom: 24px;
    }

    .encabezado h1 {
      margin: 0 0 6px;
      font-size: 29px;
    }

    .encabezado p {
      margin: 0;
      color: #777;
    }

    .tarjeta {
      background: white;
      padding: 23px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.07);
    }

    h2, h3 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd6df;
      border-radius: 14px;
      font-size: 16px;
      background: #faf8fb;
      font-family: Arial, sans-serif;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    button {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    #btnLogin,
    #btnCerrar {
      width: 100%;
      padding: 15px;
      font-size: 16px;
    }

    #btnLogin {
      background: #514458;
      color: white;
    }

    .oculto {
      display: none !important;
    }

    .mensaje {
      margin-top: 15px;
      padding: 14px;
      border-radius: 13px;
    }

    .error {
      background: #fdeeee;
      color: #8b2525;
    }

    .exito {
      background: #edf8ef;
      color: #276337;
    }

    .barra {
      margin-bottom: 20px;
      padding-bottom: 17px;
      border-bottom: 1px solid #eee9f0;
    }

    .negocio {
      background: #f3eff5;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 15px;
    }

    .negocio-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .negocio-nombre {
      font-size: 18px;
      font-weight: bold;
      color: #514458;
    }

    .correo {
      font-size: 14px;
      color: #777;
      margin-bottom: 12px;
    }

    .cerrar {
      background: #eee9f0;
      color: #514458;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin: 20px 0;
    }

    .menu button {
      padding: 13px 8px;
      background: #eee9f0;
      color: #514458;
      font-size: 14px;
    }

    .menu button.activo {
      background: #514458;
      color: white;
    }

    .titulo-seccion {
      margin: 22px 0 14px;
    }

    .citas,
    .lista-servicios {
      display: grid;
      gap: 15px;
    }

    .cita,
    .servicio {
      background: #faf8fb;
      border: 1px solid #ebe5ed;
      border-radius: 17px;
      padding: 17px;
    }

    .fecha,
    .servicio-nombre {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .hora {
      color: #514458;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .dato {
      margin: 5px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .estado {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #eee9f0;
      font-size: 13px;
      font-weight: bold;
    }

    .estado-confirmada,
    .activo-si {
      background: #e7f5ec;
      color: #26633a;
    }

    .estado-pendiente {
      background: #fff4d6;
      color: #815f00;
    }

    .estado-atendida {
      background: #e7efff;
      color: #29528a;
    }

    .estado-cancelada,
    .activo-no {
      background: #fde7e7;
      color: #8a3030;
    }

    .estado-no_asistio {
      background: #eeeeee;
      color: #555;
    }

    .acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .acciones button {
      padding: 11px 8px;
      font-size: 13px;
    }

    .btn-confirmar {
      background: #e4f5e9;
      color: #27633a;
    }

    .btn-atendida {
      background: #e6efff;
      color: #294f85;
    }

    .btn-cancelar {
      background: #fde8e8;
      color: #8b3030;
    }

    .btn-no-asistio {
      background: #ececec;
      color: #444;
    }

    .btn-editar {
      background: #eee9f0;
      color: #514458;
    }

    .btn-desactivar {
      background: #fde8e8;
      color: #8b3030;
    }

    .btn-activar {
      background: #e4f5e9;
      color: #27633a;
    }

    .acciones button:disabled {
      opacity: .45;
      cursor: default;
    }

    .form-servicio {
      background: #f6f2f7;
      padding: 17px;
      border-radius: 17px;
      margin-bottom: 20px;
    }

    .form-servicio button {
      width: 100%;
      padding: 14px;
      margin-top: 4px;
    }

    .btn-guardar {
      background: #514458;
      color: white;
    }

    .btn-cancelar-edicion {
      margin-top: 8px !important;
      background: #e8e3ea;
      color: #514458;
    }

    .precio {
      font-size: 18px;
      font-weight: bold;
      color: #514458;
      margin-top: 8px;
    }

    .cargando,
    .sin-datos {
      text-align: center;
      padding: 25px 10px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>AR Agenda</h1>
    <p>Panel de administración</p>
  </div>

  <div class="tarjeta">

    <div id="login">

      <h2>Iniciar sesión</h2>

      <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
      >

      <button id="btnLogin">
        Entrar
      </button>

    </div>


    <div id="panel" class="oculto">

      <div class="barra">

        <div class="negocio">
          <div class="negocio-label">
            Negocio
          </div>

          <div
            id="nombreNegocio"
            class="negocio-nombre"
          >
            Cargando...
          </div>
        </div>

        <div class="correo">
          Sesión:
          <span id="correoUsuario"></span>
        </div>

        <button
          id="btnCerrar"
          class="cerrar"
        >
          Cerrar sesión
        </button>

      </div>


      <div class="menu">

        <button
          id="tabCitas"
          class="activo"
          onclick="mostrarSeccion('citas')"
        >
          📅 Citas
        </button>

        <button
          id="tabServicios"
          onclick="mostrarSeccion('servicios')"
        >
          🛍️ Servicios
        </button>

      </div>


      <div id="seccionCitas">

        <h2 class="titulo-seccion">
          Próximas citas
        </h2>

        <div id="listaCitas" class="citas">

          <div class="cargando">
            Cargando citas...
          </div>

        </div>

      </div>


      <div
        id="seccionServicios"
        class="oculto"
      >

        <h2 class="titulo-seccion">
          Servicios
        </h2>

        <div class="form-servicio">

          <h3 id="tituloFormServicio">
            Agregar servicio
          </h3>

          <input
            type="text"
            id="servicioNombre"
            placeholder="Nombre del servicio"
          >

          <textarea
            id="servicioDescripcion"
            placeholder="Descripción"
          ></textarea>

          <input
            type="number"
            id="servicioDuracion"
            placeholder="Duración en minutos"
            min="1"
          >

          <input
            type="number"
            id="servicioPrecio"
            placeholder="Precio"
            min="0"
            step="0.01"
          >

          <button
            id="btnGuardarServicio"
            class="btn-guardar"
            onclick="guardarServicio()"
          >
            + Agregar servicio
          </button>

          <button
            id="btnCancelarEdicion"
            class="btn-cancelar-edicion oculto"
            onclick="cancelarEdicionServicio()"
          >
            Cancelar edición
          </button>

        </div>


        <div
          id="listaServicios"
          class="lista-servicios"
        >

          <div class="cargando">
            Cargando servicios...
          </div>

        </div>

      </div>

    </div>


    <div
      id="mensaje"
      class="mensaje oculto"
    ></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://wbdijpsiovssuhxzzovi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_T-fiB_MwofciQDOd7KWVOQ_LBVpq9xB";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let negocioActualId = null;

let negocioActualNombre = null;

let servicioEditandoId = null;


const login =
  document.getElementById("login");

const panel =
  document.getElementById("panel");

const mensaje =
  document.getElementById("mensaje");

const listaCitas =
  document.getElementById("listaCitas");

const listaServicios =
  document.getElementById("listaServicios");

const nombreNegocio =
  document.getElementById("nombreNegocio");


document
  .getElementById("btnLogin")
  .addEventListener(
    "click",
    iniciarSesion
  );


document
  .getElementById("btnCerrar")
  .addEventListener(
    "click",
    cerrarSesion
  );


async function iniciarSesion() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  ocultarMensaje();

  if (!email || !password) {

    mostrarError(
      "Escribe tu correo y contraseña."
    );

    return;
  }


  const {
    data,
    error
  } = await db.auth.signInWithPassword({
    email,
    password
  });


  if (error) {

    mostrarError(
      "Correo o contraseña incorrectos."
    );

    return;
  }


  await mostrarPanel(
    data.user
  );
}


async function cerrarSesion() {

  await db.auth.signOut();

  negocioActualId = null;

  negocioActualNombre = null;

  servicioEditandoId = null;

  panel.classList.add("oculto");

  login.classList.remove("oculto");

  document
    .getElementById("password")
    .value = "";

  ocultarMensaje();
}


async function mostrarPanel(usuario) {

  login.classList.add("oculto");

  panel.classList.remove("oculto");

  document
    .getElementById("correoUsuario")
    .textContent =
      usuario.email;

  nombreNegocio.textContent =
    "Cargando...";


  const negocioEncontrado =
    await cargarNegocioUsuario(
      usuario.id
    );


  if (!negocioEncontrado) {

    listaCitas.innerHTML =
      '<div class="sin-datos">No se encontró un negocio asociado a esta cuenta.</div>';

    return;
  }


  await cargarCitas();
}


async function cargarNegocioUsuario(
  usuarioId
) {

  const {
    data: membresias,
    error
  } = await db
    .from("miembros_negocio")
    .select(`
      negocio_id,
      es_admin,
      es_profesional,
      activo
    `)
    .eq(
      "usuario_id",
      usuarioId
    )
    .eq(
      "activo",
      true
    )
    .limit(1);


  if (error) {

    console.error(error);

    nombreNegocio.textContent =
      "No disponible";

    mostrarError(
      "No fue posible identificar el negocio."
    );

    return false;
  }


  if (
    !membresias ||
    membresias.length === 0
  ) {

    nombreNegocio.textContent =
      "Sin negocio";

    return false;
  }


  negocioActualId =
    membresias[0].negocio_id;


  const {
    data: negocios,
    error: errorNegocio
  } = await db
    .from("negocios_publicos")
    .select("id, nombre")
    .eq(
      "id",
      negocioActualId
    )
    .limit(1);


  if (
    errorNegocio ||
    !negocios ||
    negocios.length === 0
  ) {

    console.error(errorNegocio);

    nombreNegocio.textContent =
      "Negocio";

    negocioActualNombre =
      "Negocio";

    return true;
  }


  negocioActualNombre =
    negocios[0].nombre;

  nombreNegocio.textContent =
    negocioActualNombre;


  return true;
}


function mostrarSeccion(seccion) {

  ocultarMensaje();


  const seccionCitas =
    document.getElementById(
      "seccionCitas"
    );

  const seccionServicios =
    document.getElementById(
      "seccionServicios"
    );

  const tabCitas =
    document.getElementById(
      "tabCitas"
    );

  const tabServicios =
    document.getElementById(
      "tabServicios"
    );


  if (
    seccion ===
    "servicios"
  ) {

    seccionCitas.classList.add(
      "oculto"
    );

    seccionServicios.classList.remove(
      "oculto"
    );

    tabCitas.classList.remove(
      "activo"
    );

    tabServicios.classList.add(
      "activo"
    );

    cargarServicios();

  } else {

    seccionServicios.classList.add(
      "oculto"
    );

    seccionCitas.classList.remove(
      "oculto"
    );

    tabServicios.classList.remove(
      "activo"
    );

    tabCitas.classList.add(
      "activo"
    );

    cargarCitas();
  }

}


async function cargarCitas() {

  listaCitas.innerHTML =
    '<div class="cargando">Cargando citas...</div>';


  const hoy =
    new Date();


  const hoyTexto =
    hoy.getFullYear()
    + "-"
    + String(
        hoy.getMonth() + 1
      ).padStart(2, "0")
    + "-"
    + String(
        hoy.getDate()
      ).padStart(2, "0");


  const {
    data: citas,
    error
  } = await db
    .from("citas")
    .select(`
      id,
      negocio_id,
      profesional_id,
      paciente_nombre,
      paciente_telefono,
      paciente_email,
      fecha,
      hora_inicio,
      hora_fin,
      estado,
      servicios (
        nombre
      )
    `)
    .eq(
      "negocio_id",
      negocioActualId
    )
    .gte(
      "fecha",
      hoyTexto
    )
    .order(
      "fecha",
      {
        ascending: true
      }
    )
    .order(
      "hora_inicio",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    listaCitas.innerHTML =
      '<div class="sin-datos">No fue posible cargar las citas.</div>';

    return;
  }


  if (
    !citas ||
    citas.length === 0
  ) {

    listaCitas.innerHTML =
      '<div class="sin-datos">No tienes próximas citas.</div>';

    return;
  }


  const idsProfesionales =
    [
      ...new Set(
        citas
          .map(
            cita =>
              cita.profesional_id
          )
          .filter(Boolean)
      )
    ];


  let mapaProfesionales = {};


  if (
    idsProfesionales.length > 0
  ) {

    const {
      data: profesionales
    } = await db
      .from(
        "profesionales_publicos"
      )
      .select(
        "id, nombre"
      )
      .in(
        "id",
        idsProfesionales
      );


    if (profesionales) {

      profesionales.forEach(
        profesional => {

          mapaProfesionales[
            profesional.id
          ] =
            profesional.nombre;

        }
      );

    }

  }


  listaCitas.innerHTML = "";


  citas.forEach(cita => {

    const tarjeta =
      document.createElement(
        "div"
      );

    tarjeta.className =
      "cita";


    const fechaBonita =
      formatearFecha(
        cita.fecha
      );


    const horaInicio =
      String(
        cita.hora_inicio
      ).substring(0, 5);


    const horaFin =
      String(
        cita.hora_fin
      ).substring(0, 5);


    const servicio =
      cita.servicios
      ? cita.servicios.nombre
      : "Sin servicio";


    const profesional =
      mapaProfesionales[
        cita.profesional_id
      ] ||
      "Sin profesional";


    tarjeta.innerHTML = `

      <div class="fecha">
        📅 ${fechaBonita}
      </div>

      <div class="hora">
        🕐 ${horaInicio} - ${horaFin}
      </div>

      <div class="dato">
        <strong>Paciente:</strong>
        ${escapar(
          cita.paciente_nombre || ""
        )}
      </div>

      <div class="dato">
        <strong>Teléfono:</strong>
        ${escapar(
          cita.paciente_telefono || ""
        )}
      </div>

      ${
        cita.paciente_email
        ?
        `
        <div class="dato">
          <strong>Correo:</strong>
          ${escapar(
            cita.paciente_email
          )}
        </div>
        `
        :
        ""
      }

      <div class="dato">
        <strong>Servicio:</strong>
        ${escapar(servicio)}
      </div>

      <div class="dato">
        <strong>Profesional:</strong>
        ${escapar(profesional)}
      </div>

      <div
        class="estado estado-${cita.estado}"
      >
        ${nombreEstado(
          cita.estado
        )}
      </div>

      <div class="acciones">

        <button
          class="btn-confirmar"
          onclick="cambiarEstado(
            '${cita.id}',
            'confirmada'
          )"
          ${
            cita.estado ===
            "confirmada"
            ? "disabled"
            : ""
          }
        >
          ✓ Confirmar
        </button>

        <button
          class="btn-atendida"
          onclick="cambiarEstado(
            '${cita.id}',
            'atendida'
          )"
          ${
            cita.estado ===
            "atendida"
            ? "disabled"
            : ""
          }
        >
          ✓ Atendida
        </button>

        <button
          class="btn-cancelar"
          onclick="cambiarEstado(
            '${cita.id}',
            'cancelada'
          )"
          ${
            cita.estado ===
            "cancelada"
            ? "disabled"
            : ""
          }
        >
          ✕ Cancelar
        </button>

        <button
          class="btn-no-asistio"
          onclick="cambiarEstado(
            '${cita.id}',
            'no_asistio'
          )"
          ${
            cita.estado ===
            "no_asistio"
            ? "disabled"
            : ""
          }
        >
          No asistió
        </button>

      </div>

    `;


    listaCitas.appendChild(
      tarjeta
    );

  });

}


async function cambiarEstado(
  citaId,
  nuevoEstado
) {

  ocultarMensaje();


  if (
    nuevoEstado ===
    "cancelada"
  ) {

    const confirmar =
      window.confirm(
        "¿Seguro que deseas cancelar esta cita?"
      );

    if (!confirmar) {
      return;
    }

  }


  const {
    error
  } = await db
    .from("citas")
    .update({
      estado:
        nuevoEstado
    })
    .eq(
      "id",
      citaId
    )
    .eq(
      "negocio_id",
      negocioActualId
    );


  if (error) {

    console.error(error);

    mostrarError(
      "No fue posible cambiar el estado."
    );

    return;
  }


  mostrarExito(
    "Estado actualizado correctamente."
  );


  await cargarCitas();
}


async function cargarServicios() {

  listaServicios.innerHTML =
    '<div class="cargando">Cargando servicios...</div>';


  const {
    data: servicios,
    error
  } = await db
    .from("servicios")
    .select(`
      id,
      nombre,
      descripcion,
      duracion_minutos,
      precio,
      activo
    `)
    .eq(
      "negocio_id",
      negocioActualId
    )
    .order(
      "nombre",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    listaServicios.innerHTML =
      '<div class="sin-datos">No fue posible cargar los servicios.</div>';

    return;
  }


  if (
    !servicios ||
    servicios.length === 0
  ) {

    listaServicios.innerHTML =
      '<div class="sin-datos">Aún no hay servicios.</div>';

    return;
  }


  listaServicios.innerHTML = "";


  servicios.forEach(servicio => {

    const tarjeta =
      document.createElement(
        "div"
      );

    tarjeta.className =
      "servicio";


    const precio =
      Number(
        servicio.precio || 0
      ).toFixed(2);


    tarjeta.innerHTML = `

      <div class="servicio-nombre">
        ${escapar(
