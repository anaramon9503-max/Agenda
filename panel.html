<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Agenda | Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f5f8;
      color: #29252e;
      padding: 24px 15px;
    }

    .contenedor {
      max-width: 650px;
      margin: auto;
    }

    .encabezado {
      text-align: center;
      margin-bottom: 24px;
    }

    .encabezado h1 {
      margin: 0 0 6px;
      font-size: 29px;
    }

    .encabezado p {
      margin: 0;
      color: #777;
    }

    .tarjeta {
      background: white;
      padding: 23px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.07);
    }

    h2 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 13px;
      border: 1px solid #ddd6df;
      border-radius: 14px;
      font-size: 16px;
      background: #faf8fb;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    #btnLogin,
    #btnCerrar {
      width: 100%;
      padding: 15px;
      font-size: 16px;
    }

    #btnLogin {
      background: #514458;
      color: white;
    }

    .oculto {
      display: none !important;
    }

    .mensaje {
      margin-top: 15px;
      padding: 14px;
      border-radius: 13px;
    }

    .error {
      background: #fdeeee;
      color: #8b2525;
    }

    .exito {
      background: #edf8ef;
      color: #276337;
    }

    .barra {
      margin-bottom: 20px;
      padding-bottom: 17px;
      border-bottom: 1px solid #eee9f0;
    }

    .negocio {
      background: #f3eff5;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 15px;
    }

    .negocio-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .negocio-nombre {
      font-size: 18px;
      font-weight: bold;
      color: #514458;
    }

    .correo {
      font-size: 14px;
      color: #777;
      margin-bottom: 12px;
    }

    .cerrar {
      background: #eee9f0;
      color: #514458;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin: 20px 0 24px;
    }

    .tab {
      padding: 13px;
      background: #f0edf2;
      color: #625a66;
      font-size: 14px;
    }

    .tab.activa {
      background: #514458;
      color: white;
    }

    .titulo-citas {
      margin: 8px 0 14px;
    }

    .citas {
      display: grid;
      gap: 15px;
    }

    .cita {
      background: #faf8fb;
      border: 1px solid #ebe5ed;
      border-radius: 17px;
      padding: 17px;
    }

    .fecha {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .hora {
      color: #514458;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .dato {
      margin: 5px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .estado {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #eee9f0;
      font-size: 13px;
      font-weight: bold;
    }

    .estado-confirmada {
      background: #e7f5ec;
      color: #26633a;
    }

    .estado-pendiente {
      background: #fff4d6;
      color: #815f00;
    }

    .estado-atendida {
      background: #e7efff;
      color: #29528a;
    }

    .estado-cancelada {
      background: #fde7e7;
      color: #8a3030;
    }

    .estado-no_asistio {
      background: #eeeeee;
      color: #555;
    }

    .acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .acciones button {
      padding: 11px 8px;
      font-size: 13px;
    }

    .btn-confirmar {
      background: #e4f5e9;
      color: #27633a;
    }

    .btn-atendida {
      background: #e6efff;
      color: #294f85;
    }

    .btn-cancelar {
      background: #fde8e8;
      color: #8b3030;
    }

    .btn-no-asistio {
      background: #ececec;
      color: #444;
    }

    .acciones button:disabled {
      opacity: .45;
      cursor: default;
    }

    .cargando,
    .sin-citas {
      text-align: center;
      padding: 25px 10px;
      color: #777;
    }

    .form-servicio {
      background: #f8f5f9;
      border: 1px solid #ebe5ed;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 22px;
    }

    .form-servicio h3 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    .fila-doble {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-guardar {
      width: 100%;
      padding: 14px;
      background: #514458;
      color: white;
      font-size: 15px;
    }

    .btn-cancelar-edicion {
      width: 100%;
      padding: 12px;
      margin-top: 9px;
      background: #eae6ec;
      color: #514458;
    }

    .lista-servicios {
      display: grid;
      gap: 14px;
    }

    .servicio-card {
      border: 1px solid #ebe5ed;
      border-radius: 17px;
      padding: 16px;
      background: #faf8fb;
    }

    .servicio-cabecera {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .servicio-nombre {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .servicio-precio {
      font-weight: bold;
      color: #514458;
      white-space: nowrap;
    }

    .servicio-descripcion {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.5;
      color: #555;
    }

    .servicio-meta {
      margin-top: 10px;
      font-size: 13px;
      color: #777;
    }

    .servicio-estado {
      display: inline-block;
      padding: 5px 9px;
      font-size: 12px;
      border-radius: 999px;
    }

    .servicio-estado.activo {
      background: #e7f5ec;
      color: #27633a;
    }

    .servicio-estado.inactivo {
      background: #eeeeee;
      color: #666;
    }

    .servicio-acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .servicio-acciones button {
      padding: 11px;
    }

    .btn-editar {
      background: #ece7ef;
      color: #514458;
    }

    .btn-activar {
      background: #f3edf5;
      color: #514458;
    }

    @media (max-width: 420px) {
      .fila-doble {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>AR Agenda</h1>
    <p>Panel de administración</p>
  </div>

  <div class="tarjeta">

    <div id="login">

      <h2>Iniciar sesión</h2>

      <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
      >

      <button id="btnLogin">
        Entrar
      </button>

    </div>


    <div id="panel" class="oculto">

      <div class="barra">

        <div class="negocio">

          <div class="negocio-label">
            Negocio
          </div>

          <div
            id="nombreNegocio"
            class="negocio-nombre"
          >
            Cargando...
          </div>

        </div>

        <div class="correo">
          Sesión:
          <span id="correoUsuario"></span>
        </div>

        <button
          id="btnCerrar"
          class="cerrar"
        >
          Cerrar sesión
        </button>

      </div>


      <div class="tabs">

        <button
          id="btnTabCitas"
          class="tab activa"
        >
          📅 Citas
        </button>

        <button
          id="btnTabServicios"
          class="tab"
        >
          🛍️ Servicios
        </button>

      </div>


      <div id="seccionCitas">

        <h2 class="titulo-citas">
          Próximas citas 💜
        </h2>

        <div
          id="listaCitas"
          class="citas"
        >
          <div class="cargando">
            Cargando citas...
          </div>
        </div>

      </div>


      <div
        id="seccionServicios"
        class="oculto"
      >

        <div class="form-servicio">

          <h3 id="tituloFormularioServicio">
            Agregar servicio
          </h3>

          <form id="formularioServicio">

            <input
              type="text"
              id="servicioNombre"
              placeholder="Nombre del servicio"
              required
            >

            <textarea
              id="servicioDescripcion"
              placeholder="Descripción"
            ></textarea>

            <div class="fila-doble">

              <input
                type="number"
                id="servicioDuracion"
                placeholder="Duración en minutos"
                value="60"
                min="1"
                required
              >

              <input
                type="number"
                id="servicioPrecio"
                placeholder="Precio"
                min="0"
                step="0.01"
                required
              >

            </div>

            <button
              type="submit"
              class="btn-guardar"
            >
              Guardar servicio
            </button>

            <button
              type="button"
              id="btnCancelarEdicion"
              class="btn-cancelar-edicion oculto"
            >
              Cancelar edición
            </button>

          </form>

        </div>


        <h2>
          Mis servicios
        </h2>

        <div
          id="listaServicios"
          class="lista-servicios"
        >
          <div class="cargando">
            Cargando servicios...
          </div>
        </div>

      </div>

    </div>


    <div
      id="mensaje"
      class="mensaje oculto"
    ></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://wbdijpsiovssuhxzzovi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_T-fiB_MwofciQDOd7KWVOQ_LBVpq9xB";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let negocioActualId = null;
let negocioActualNombre = null;
let servicioEditandoId = null;


const login =
  document.getElementById("login");

const panel =
  document.getElementById("panel");

const mensaje =
  document.getElementById("mensaje");

const listaCitas =
  document.getElementById("listaCitas");

const nombreNegocio =
  document.getElementById("nombreNegocio");

const seccionCitas =
  document.getElementById("seccionCitas");

const seccionServicios =
  document.getElementById("seccionServicios");

const btnTabCitas =
  document.getElementById("btnTabCitas");

const btnTabServicios =
  document.getElementById("btnTabServicios");

const listaServicios =
  document.getElementById("listaServicios");

const formularioServicio =
  document.getElementById("formularioServicio");

const tituloFormularioServicio =
  document.getElementById(
    "tituloFormularioServicio"
  );

const btnCancelarEdicion =
  document.getElementById(
    "btnCancelarEdicion"
  );


document
  .getElementById("btnLogin")
  .addEventListener(
    "click",
    iniciarSesion
  );


document
  .getElementById("btnCerrar")
  .addEventListener(
    "click",
    cerrarSesion
  );


btnTabCitas.addEventListener(
  "click",
  () => cambiarPestana("citas")
);


btnTabServicios.addEventListener(
  "click",
  () => cambiarPestana("servicios")
);


formularioServicio.addEventListener(
  "submit",
  guardarServicio
);


btnCancelarEdicion.addEventListener(
  "click",
  limpiarFormularioServicio
);


async function iniciarSesion() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  ocultarMensaje();


  if (!email || !password) {

    mostrarError(
      "Escribe tu correo y contraseña."
    );

    return;
  }


  const {
    data,
    error
  } = await db.auth.signInWithPassword({
    email,
    password
  });


  if (error) {

    mostrarError(
      "Correo o contraseña incorrectos."
    );

    return;
  }


  await mostrarPanel(
    data.user
  );
}


async function cerrarSesion() {

  await db.auth.signOut();

  negocioActualId = null;
  negocioActualNombre = null;
  servicioEditandoId = null;

  panel.classList.add("oculto");

  login.classList.remove("oculto");

  document
    .getElementById("password")
    .value = "";

  ocultarMensaje();
}


async function mostrarPanel(usuario) {

  login.classList.add("oculto");

  panel.classList.remove("oculto");

  document
    .getElementById("correoUsuario")
    .textContent =
      usuario.email;

  nombreNegocio.textContent =
    "Cargando...";


  const negocioEncontrado =
    await cargarNegocioUsuario(
      usuario.id
    );


  if (!negocioEncontrado) {

    listaCitas.innerHTML =
      '<div class="sin-citas">No se encontró un negocio asociado a esta cuenta.</div>';

    return;
  }


  cambiarPestana("citas");

  await cargarCitas();
}


async function cargarNegocioUsuario(
  usuarioId
) {

  const {
    data: membresias,
    error
  } = await db
    .from("miembros_negocio")
    .select(
      "negocio_id, es_admin, es_profesional, activo"
    )
    .eq(
      "usuario_id",
      usuarioId
    )
    .eq(
      "activo",
      true
    )
    .limit(1);


  if (error) {

    console.error(error);

    nombreNegocio.textContent =
      "No disponible";

    mostrarError(
      "No fue posible identificar el negocio de esta cuenta."
    );

    return false;
  }


  if (
    !membresias ||
    membresias.length === 0
  ) {

    nombreNegocio.textContent =
      "Sin negocio";

    return false;
  }


  negocioActualId =
    membresias[0].negocio_id;


  const {
    data: negocios,
    error: errorNegocio
  } = await db
    .from("negocios_publicos")
    .select("id, nombre")
    .eq(
      "id",
      negocioActualId
    )
    .limit(1);


  if (
    errorNegocio ||
    !negocios ||
    negocios.length === 0
  ) {

    console.error(errorNegocio);

    nombreNegocio.textContent =
      "Negocio";

    negocioActualNombre =
      "Negocio";

    return true;
  }


  negocioActualNombre =
    negocios[0].nombre;


  nombreNegocio.textContent =
    negocioActualNombre;


  return true;
}


function cambiarPestana(
  pestana
) {

  ocultarMensaje();

  const viendoCitas =
    pestana === "citas";


  seccionCitas.classList.toggle(
    "oculto",
    !viendoCitas
  );


  seccionServicios.classList.toggle(
    "oculto",
    viendoCitas
  );


  btnTabCitas.classList.toggle(
    "activa",
    viendoCitas
  );


  btnTabServicios.classList.toggle(
    "activa",
    !viendoCitas
  );


  if (!viendoCitas) {

    cargarServicios();

  }

}


async function cargarCitas() {

  listaCitas.innerHTML =
    '<div class="cargando">Cargando citas...</div>';


  const hoy =
    new Date();


  const hoyTexto =
    hoy.getFullYear()
    + "-"
    + String(
        hoy.getMonth() + 1
      ).padStart(2, "0")
    + "-"
    + String(
        hoy.getDate()
      ).padStart(2, "0");


  const {
    data: citas,
    error
  } = await db
    .from("citas")
    .select(`
      id,
      negocio_id,
      profesional_id,
      paciente_nombre,
      paciente_telefono,
      paciente_email,
      fecha,
      hora_inicio,
      hora_fin,
      estado,
      servicios (
        nombre
      )
    `)
    .eq(
      "negocio_id",
      negocioActualId
    )
    .gte(
      "fecha",
      hoyTexto
    )
    .order(
      "fecha",
      {
        ascending: true
      }
    )
    .order(
      "hora_inicio",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    listaCitas.innerHTML =
      '<div class="sin-citas">No fue posible cargar las citas.</div>';

    return;
  }


  if (
    !citas ||
    citas.length === 0
  ) {

    listaCitas.innerHTML =
      '<div class="sin-citas">No tienes próximas citas.</div>';

    return;
  }


  const idsProfesionales =
    [
      ...new Set(
        citas
          .map(
            cita =>
              cita.profesional_id
          )
          .filter(Boolean)
      )
    ];


  let mapaProfesionales = {};


  if (
    idsProfesionales.length > 0
  ) {

    const {
      data: profesionales,
      error: errorProfesionales
    } = await db
      .from(
        "profesionales_publicos"
      )
      .select(
        "id, nombre"
      )
      .in(
        "id",
        idsProfesionales
      );


    if (
      !errorProfesionales &&
      profesionales
    ) {

      profesionales.forEach(
        profesional => {

          mapaProfesionales[
            profesional.id
          ] =
            profesional.nombre;

        }
      );

    }

  }


  listaCitas.innerHTML = "";


  citas.forEach(cita => {

    const tarjeta =
      document.createElement(
        "div"
      );

    tarjeta.className =
      "cita";


    const fechaBonita =
      formatearFecha(
        cita.fecha
      );


    const horaInicio =
      String(
        cita.hora_inicio
      ).substring(
        0,
        5
      );


    const horaFin =
      String(
        cita.hora_fin
      ).substring(
        0,
        5
      );


    const servicio =
      cita.servicios
      ? cita.servicios.nombre
      : "Sin servicio";


    const profesional =
      mapaProfesionales[
        cita.profesional_id
      ] ||
      "Sin profesional";


    const estadoTexto =
      nombreEstado(
        cita.estado
      );


    tarjeta.innerHTML = `

      <div class="fecha">
        📅 ${fechaBonita}
      </div>

      <div class="hora">
        🕐 ${horaInicio} - ${horaFin}
      </div>

      <div class="dato">
        <strong>Paciente:</strong>
        ${escapar(
          cita.paciente_nombre || ""
        )}
      </div>

      <div class="dato">
        <strong>Teléfono:</strong>
        ${escapar(
          cita.paciente_telefono || ""
        )}
      </div>

      ${
        cita.paciente_email
        ?
        `
        <div class="dato">
          <strong>Correo:</strong>
          ${escapar(
            cita.paciente_email
          )}
        </div>
        `
        :
        ""
      }

      <div class="dato">
        <strong>Servicio:</strong>
        ${escapar(servicio)}
      </div>

      <div class="dato">
        <strong>Profesional:</strong>
        ${escapar(profesional)}
      </div>

      <div
        class="estado estado-${cita.estado}"
      >
        ${estadoTexto}
      </div>

      <div class="acciones">

        <button
          class="btn-confirmar"
          data-id="${cita.id}"
          data-estado="confirmada"
          ${
            cita.estado ===
            "confirmada"
            ? "disabled"
            : ""
          }
        >
          ✓ Confirmar
        </button>

        <button
          class="btn-atendida"
          data-id="${cita.id}"
          data-estado="atendida"
          ${
            cita.estado ===
            "atendida"
            ? "disabled"
            : ""
          }
        >
          ✓ Atendida
        </button>

        <button
          class="btn-cancelar"
          data-id="${cita.id}"
          data-estado="cancelada"
          ${
            cita.estado ===
            "cancelada"
            ? "disabled"
            : ""
          }
        >
          ✕ Cancelar
        </button>

        <button
          class="btn-no-asistio"
          data-id="${cita.id}"
          data-estado="no_asistio"
          ${
            cita.estado ===
            "no_asistio"
            ? "disabled"
            : ""
          }
        >
          No asistió
        </button>

      </div>

    `;


    tarjeta
      .querySelectorAll
