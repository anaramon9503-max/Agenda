<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Agenda | Horarios</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>AR Agenda</h1>
    <p>Administración de horarios</p>
  </div>

  <div class="tarjeta">

    <div class="barra">

      <div class="negocio">

        <div class="negocio-label">
          Negocio
        </div>

        <div
          id="nombreNegocio"
          class="negocio-nombre"
        >
          Cargando...
        </div>

      </div>


      <div class="correo">
        Sesión:
        <span id="correoUsuario"></span>
      </div>


      <button
        id="btnVolver"
        class="cerrar"
        style="width:100%; padding:15px; margin-bottom:10px;"
      >
        ← Volver a citas
      </button>


      <button
        id="btnCerrar"
        class="cerrar"
        style="width:100%; padding:15px;"
      >
        Cerrar sesión
      </button>

    </div>


    <div class="form-servicio">

      <h3>
        Agregar horario
      </h3>


      <label for="profesionalHorario">
        Profesional
      </label>

      <select
        id="profesionalHorario"
        required
      >
        <option value="">
          Selecciona un profesional
        </option>
      </select>

      <label for="servicioHorario">
  Servicio
</label>

<select
  id="servicioHorario"
  required
>
  <option value="">
    Primero selecciona un profesional
  </option>
</select>

      <label for="diaHorario">
        Día
      </label>

      <select
        id="diaHorario"
        required
      >

        <option value="">
          Selecciona un día
        </option>

        <option value="1">
          Lunes
        </option>

        <option value="2">
          Martes
        </option>

        <option value="3">
          Miércoles
        </option>

        <option value="4">
          Jueves
        </option>

        <option value="5">
          Viernes
        </option>

        <option value="6">
          Sábado
        </option>

        <option value="7">
          Domingo
        </option>

      </select>


      <div class="fila-doble">

        <div>

          <label for="horaInicio">
            Hora de inicio
          </label>

          <input
            type="time"
            id="horaInicio"
            required
          >

        </div>


        <div>

          <label for="horaFin">
            Hora de fin
          </label>

          <input
            type="time"
            id="horaFin"
            required
          >

        </div>

      </div>


      <button
        type="button"
        id="btnGuardarHorario"
        class="btn-guardar"
      >
        Guardar horario
      </button>

    </div>


    <h2>
      Horarios configurados
    </h2>


    <div
      id="listaHorarios"
      class="lista-servicios"
    >

      <div class="cargando">
        Cargando horarios...
      </div>

    </div>


    <div
      id="mensaje"
      class="mensaje oculto"
    ></div>

  </div>

</div>


<script src="horarios.js"></script>

</body>
</html>
